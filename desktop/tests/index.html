<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Mocha Tests</title>

	<link rel="stylesheet" href="../src/assets/css/main.css">
	<link rel="stylesheet" href="../src/assets/css/header.css">
	<link rel="stylesheet" href="../src/assets/css/visualiser.css">
	<link rel="stylesheet" href="../src/assets/css/calendar.css" />
	<link rel="stylesheet" href="../src/assets/css/logform.css">
	<link rel="stylesheet" href="../src/assets/css/meta.css">

	<script src="../node_modules/mocha/mocha.js"></script>
	<link rel="stylesheet" href="../node_modules/mocha/mocha.css">
	<style>#mocha-stats {background:bisque;border-radius:2px;
	padding:5px!important;}#mocha{text-transform: none;}</style>
</head>
<body>
	<div id="mocha"></div>
	<!-- run with `npm test`; Node's assert is there because the page runs in Electron -->
	<script>mocha.setup('bdd'); mocha.checkLeaks(); window.assert = require('assert')</script>

	<!-- Default log items, should reflect non-test index -->
	<div id="header-root"></div>
	<div id="vis-root"></div>
	<div id="cal-root"></div>
	<section id="cal-info"></section>
	<section id="meta-root"></section>
	<div id="log-root"></div>

	<script src="../src/Components/Util.js"></script>
	<script src="../src/locales/locales.js"></script>
	<script src="../src/Components/Config.js"></script>
	<script src="../src/Components/Storage.js"></script>
	<script src="../src/Components/Module.js"></script>
	<script src="../src/Components/Meta.js"></script>
	<script src="../src/Components/Logform.js"></script>
	<script src="../src/Components/Calendar.js"></script>
	<script src="../src/Components/Header.js"></script>
	<script src="../src/Components/Visualiser.js"></script>
	<script src="../src/Components/Editor.js" defer></script>
	<!-- End normal log -->

	<!-- replaces normal main file -->
	<script src="test.js"></script>

	<script>
		// report to tests/main.js (npm test) when there is one
		const ipc = window.require && require('electron').ipcRenderer
		const runner = mocha.run(failures => ipc && ipc.send('tests-done', failures))
		if (ipc) {
			runner.on('pass', test => ipc.send('test-result', { title: test.fullTitle() }))
			runner.on('fail', (test, err) => ipc.send('test-result', { title: test.fullTitle(), error: err.message }))
		}
	</script>
</body>
</html>
